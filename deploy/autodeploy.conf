# jump-autodeploy config for ai-news-bot
# 被 /opt/jump-autodeploy/bin/auto-deploy.sh 读取：git fetch + git reset --hard
# （无 git clean，untracked .env / .news_cache.json 安全），命中 INSTALL_TRIGGER
# 正则才装依赖。取代旧的 scripts/auto_pull_deploy.sh（走 SSH，deploy key 失效）。
#
# 仓库是 PUBLIC，HTTPS remote 免凭证即可在 cron 里 fetch。
PROJECT_NAME=ai-news-bot
GIT_REMOTE=origin
GIT_BRANCH=main
INSTALL_TRIGGER='requirements\.txt'
INSTALL_CMD='/home/ops/ai-news-bot/venv/bin/pip install -q -r requirements.txt'
# 注意：playwright chromium 二进制不在 INSTALL 里（已安装且极少变）。若将来 bump
# playwright 需新 chromium，手动跑一次：
#   /home/ops/ai-news-bot/venv/bin/python -m playwright install chromium
