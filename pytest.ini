[pytest]
# Pytest configuration for deployment script testing

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for categorizing tests
markers =
    unit: Unit tests for individual functions
    property: Property-based tests using hypothesis
    integration: Integration tests requiring system resources
    slow: Tests that take significant time to run

# Hypothesis settings
hypothesis_profile = default

[hypothesis]
# Default profile for property-based testing
max_examples = 100
deadline = None
