name: AI News Push

on:
  schedule:
    # 每天 00:30 UTC (北京时间 08:30 AM)
    - cron: '30 0 * * *'
  workflow_dispatch:
    # 支持手动触发

jobs:
  push-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore News Cache
        id: cache-restore
        uses: actions/cache/restore@v3
        with:
          path: .news_cache.json
          key: news-cache-${{ github.run_id }}
          restore-keys: |
            news-cache-

      - name: Run News Bot
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TIANAPI_KEY: ${{ secrets.TIANAPI_KEY }}
          ACTIVE_TOPICS: ${{ secrets.ACTIVE_TOPICS || 'ai,education' }}
          PYTHONUNBUFFERED: 1
        run: python bot_wecom.py

      - name: Save News Cache
        uses: actions/cache/save@v3
        if: always()
        with:
          path: .news_cache.json
          key: news-cache-${{ github.run_id }}
