name: AI News Push

on:
  # schedule:
  #   # 每天 01:10 UTC (北京时间 09:10 AM)
  #   - cron: '10 1 * * *'
  workflow_dispatch:
    # 支持手动触发

jobs:
  push-news:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore News Cache
        id: cache-restore
        uses: actions/cache/restore@v3
        with:
          path: .news_cache.json
          key: news-cache-${{ github.run_id }}
          restore-keys: |
            news-cache-

      - name: Run News Bot
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TIANAPI_KEY: ${{ secrets.TIANAPI_KEY }}
          # 与 config.ACTIVE_TOPICS_DEFAULT 保持一致（'ai' 主题已废弃）
          ACTIVE_TOPICS: ${{ secrets.ACTIVE_TOPICS || 'study_abroad,market_data,industry_news,edu_policy,uni_rankings' }}
          PYTHONUNBUFFERED: 1
        run: python bot_wecom.py

      - name: Save News Cache
        uses: actions/cache/save@v3
        if: always()
        with:
          path: .news_cache.json
          key: news-cache-${{ github.run_id }}
