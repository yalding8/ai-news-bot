[tool.ruff]
# 与本地虚拟环境 / 缓存目录隔离，避免误 lint 第三方代码
extend-exclude = ["venv", "venv-local", ".hypothesis", "__pycache__", "out"]
# 沿用 ruff 默认规则集（E4/E7/E9 + F），不引入行长(E501)等风格噪音

[tool.pytest.ini_options]
markers = [
    "unit: 纯单元测试（无外部依赖）",
    "network: 需要访问外网（CI 默认跳过：pytest -m 'not network'）",
]

[tool.ruff.lint.per-file-ignores]
# 这两处 import 不在文件顶部是有意为之：
# smoke_wecom 需要先 sys.path.insert 再 import 项目模块；
# conftest 的 hypothesis strategies 是按需的延迟 import。
"scripts/smoke_wecom.py" = ["E402"]
"tests/conftest.py" = ["E402"]
